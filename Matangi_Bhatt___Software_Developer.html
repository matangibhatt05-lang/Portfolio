<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matangi Bhatt — Software Developer</title>
<meta name="description" content="Portfolio of Matangi Bhatt, Software Developer: Laravel, FastAPI, React, AI and OCR.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--base:#0B0B12;--surface:#151522;--accent:#8B5CF6;--glow:#B69CFF;--text:#F5F3FF;--violet:#6D28D9;--electric:#9333EA;--lav:#C4B5FD;--muted:#A1A1AA;--border:#29283A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}
body{background:var(--base);color:var(--text);font:400 16px/1.7 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
#cv{position:fixed;inset:0;z-index:-1;width:100%;height:100%;background:radial-gradient(700px 450px at 12% 8%,#8b5cf630,transparent),radial-gradient(600px 450px at 92% 45%,#6d28d930,transparent),var(--base)}
.cur{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,#8b5cf61f,transparent 65%);pointer-events:none;z-index:0;transition:transform .15s ease-out}
.prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--violet),var(--glow),var(--electric));z-index:50}
.wrap{width:100%;max-width:none;margin:0;padding:0 clamp(22px,4vw,64px);position:relative;z-index:1}
nav{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:4px;align-items:center;padding:8px 10px;border-radius:999px;background:#15152299;backdrop-filter:blur(14px);border:1px solid var(--border);max-width:calc(100% - 20px);overflow-x:auto;animation:drop .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-30px)}}
nav a{padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted);white-space:nowrap;transition:.25s}
nav a:hover{color:var(--text);background:#8b5cf630}
.logo{font-weight:700;padding:6px 12px;color:var(--lav)}
section{padding:90px 0;position:relative}
.hero{min-height:100vh;display:flex;align-items:center;padding-top:120px}
.tag{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border:1px solid var(--border);border-radius:999px;font-size:13px;color:var(--lav);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80;animation:p 2s infinite}
@keyframes p{50%{opacity:.3;transform:scale(1.4)}}
.kicker{letter-spacing:.2em;font-size:13px;color:var(--muted);margin:26px 0 10px;min-height:24px}
.caret{display:inline-block;width:2px;height:1em;background:var(--glow);margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
h1{font-size:clamp(40px,8vw,84px);line-height:1.04;font-weight:700}
h1 .ch{display:inline-block;opacity:0;transform:translateY(60px) rotate(8deg);animation:ch .8s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes ch{to{opacity:1;transform:none}}
.grad{background:linear-gradient(110deg,var(--lav),var(--accent),var(--electric),var(--lav));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.lead{color:var(--muted);font-size:19px;max-width:580px;margin:22px 0 30px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;padding:13px 24px;border-radius:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);transition:transform .2s,border-color .25s,box-shadow .25s;cursor:pointer;color:var(--text);font-size:15px;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:linear-gradient(120deg,var(--violet),var(--accent),var(--electric));background-size:200% 100%;border:0;box-shadow:0 8px 30px #8b5cf655;animation:sh2 4s ease infinite}
@keyframes sh2{50%{background-position:100% 0}}
.btn.pri:hover{box-shadow:0 10px 44px #8b5cf6bb}
.social{display:flex;gap:18px;margin-top:30px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.social a:hover{color:var(--glow)}
.fl{position:absolute;padding:8px 16px;border-radius:14px;background:#15152299;backdrop-filter:blur(8px);border:1px solid var(--border);font-size:13px;color:var(--lav);animation:fl 6s ease-in-out infinite;box-shadow:0 10px 30px #0006}
@keyframes fl{50%{transform:translateY(-22px) rotate(2deg)}}
.fls{position:absolute;right:2%;top:21%;width:300px;height:420px}
.orb{position:absolute;right:6%;top:50%;width:min(400px,40vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,var(--violet),var(--glow),var(--accent),var(--violet));filter:blur(70px);opacity:.35;animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{from{transform:translateY(-50%) rotate(0)}to{transform:translateY(-50%) rotate(360deg)}}
.mq{overflow:hidden;border-block:1px solid var(--border);padding:16px 0;background:#15152266;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq div{display:flex;gap:44px;width:max-content;animation:mq 30s linear infinite;color:var(--muted);font-family:'Space Grotesk';font-size:18px}
.mq:hover div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.sh{margin-bottom:44px}
.sh small{color:var(--accent);letter-spacing:.2em;font-size:12px;font-weight:500}
.sh h2{font-size:clamp(30px,5vw,46px);margin-top:6px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:linear-gradient(160deg,#1b1b2e,var(--surface));border:1px solid var(--border);border-radius:20px;padding:26px;position:relative;overflow:hidden;transition:transform .25s ease-out,border-color .3s,box-shadow .3s;transform-style:preserve-3d;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--x,50%) var(--y,0),#8b5cf62e,transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.card:hover{border-color:#8b5cf688;box-shadow:0 20px 50px #8b5cf626}

.card>*{position:relative}
.card h3{font-size:19px;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px}
.badge{float:right;font-size:11px;letter-spacing:.08em;color:var(--glow);border:1px solid #8b5cf655;border-radius:999px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:12px;padding:4px 11px;border-radius:999px;background:#8b5cf61f;color:var(--lav);border:1px solid #8b5cf640;transition:.25s}
.chip:hover{background:var(--accent);color:#fff;transform:translateY(-3px) scale(1.06)}
.about{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.about p{color:var(--muted);margin-bottom:14px}
.about p b{color:var(--text);font-weight:500}
.stat{font-size:42px;font-weight:700;font-family:'Space Grotesk'}
.tl{position:relative;padding-left:30px;display:grid;gap:26px}
.tl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--accent),var(--glow),transparent);transform-origin:top;animation:ln 2s ease both;animation-timeline:view();animation-range:entry 0% cover 60%}
@keyframes ln{from{transform:scaleY(0)}}
.tl .card::after{content:"";position:absolute;left:-39px;top:30px;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--base);animation:pu 2.4s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 #8b5cf6aa}100%{box-shadow:0 0 0 18px #8b5cf600}}
.date{font-size:13px;color:var(--glow);margin-bottom:6px}
ul.l{padding-left:18px;color:var(--muted);font-size:15px;margin-top:10px}
ul.l li{margin-bottom:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font:inherit;font-size:14px;transition:.25s}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.on{background:linear-gradient(120deg,var(--violet),var(--accent));color:#fff;border-color:transparent;box-shadow:0 6px 24px #8b5cf655}
.pop{animation:pop .6s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.sg{display:flex;flex-wrap:wrap;gap:8px}
.sg .chip{animation:pop .5s both}
.sk{grid-template-columns:repeat(4,1fr)}
.sk>.rv{display:flex}
.sk>.rv>.card{flex:1;width:100%;padding:22px}

.about p.goal{margin-top:18px;padding:18px 20px;border-radius:16px;border:1px solid #8b5cf655;background:linear-gradient(120deg,#6d28d933,#8b5cf61a);color:var(--text);box-shadow:0 10px 30px #8b5cf622}
.tk{display:grid;gap:16px}
.band{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:center;padding:20px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(160deg,#1b1b2e,var(--surface));transition:.3s}
.band:hover{border-color:#8b5cf688;box-shadow:0 18px 50px #8b5cf61f}
.bl{display:flex;flex-direction:column;gap:4px}
.bi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:19px;font-weight:700;font-family:'Space Grotesk';background:linear-gradient(135deg,var(--violet),var(--accent));box-shadow:0 8px 24px #8b5cf655;margin-bottom:8px}
.bl h3{font-size:18px;margin:0}

.tile{aspect-ratio:1;border-radius:16px;border:1px solid var(--border);background:var(--base);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s;cursor:default}
.rv:not(.in) .tile{opacity:0}

.etile{border-radius:16px;border:1px solid var(--border);background:var(--base);padding:16px;display:flex;align-items:center;gap:14px;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s;cursor:default}
.rv:not(.in) .etile{opacity:0}
.rv.in .etile{animation:pop .5s both}
.etile b{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:'Space Grotesk';font-size:13px;color:var(--glow);background:#8b5cf61f;border:1px solid #8b5cf644;transition:.25s}
.etile div{min-width:0}
.etile strong{display:block;font-weight:500;font-size:14px;line-height:1.35;color:var(--text)}

.etile em{display:inline-block;font-style:normal;font-size:12px;color:var(--lav);margin-top:6px;padding:2px 10px;border-radius:999px;background:#8b5cf61f;border:1px solid #8b5cf640}
.etile:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 14px 34px #8b5cf640;background:#1b1b2e}
.etile:hover b{background:linear-gradient(135deg,var(--violet),var(--accent));color:#fff}
.hire{position:relative;overflow:hidden;text-align:center;padding:56px 28px;border-radius:28px;border:1px solid #8b5cf655;background:radial-gradient(500px 260px at 50% 0,#8b5cf633,transparent),linear-gradient(160deg,#1b1b2e,var(--surface));box-shadow:0 30px 80px #8b5cf61f;margin-bottom:22px}
.hire>*{position:relative}
.hire h3{font-size:clamp(24px,4vw,38px);margin:20px auto 10px;max-width:640px;line-height:1.2}
.hire p{color:var(--muted);margin-bottom:26px}
.ring{position:absolute!important;left:50%;top:-120px;width:300px;height:300px;margin-left:-150px;border-radius:50%;border:1px solid #8b5cf666;animation:rg 4s ease-out infinite}
@keyframes rg{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cc{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;border:1px solid var(--border);background:linear-gradient(160deg,#1b1b2e,var(--surface));transition:.3s}
.cc:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 18px 44px #8b5cf63a}
.ci{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-family:'Space Grotesk';background:linear-gradient(135deg,var(--violet),var(--accent));box-shadow:0 8px 22px #8b5cf655}
.cc div{min-width:0;flex:1}
.cc small{display:block;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.cc b{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.ar{color:var(--glow);transition:.3s;font-style:normal}
.cc:hover .ar{transform:translate(3px,-3px)}
.loc{text-align:center;color:var(--muted);margin-top:24px}
@media(max-width:760px){.band{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}}
form{display:grid;gap:12px}
input,textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--base);color:var(--text);font:inherit}
input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px #8b5cf633}
footer{border-top:1px solid var(--border);padding:28px 0;color:var(--muted);font-size:14px;text-align:center;position:relative;z-index:1}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:760px){.fls,.orb{display:none}.hero{padding-top:100px}.cur{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,h1 .ch{opacity:1;transform:none}.tl::before{transform:none}}
</style>

<body>
<canvas id="cv"></canvas>
<div class="cur" id="cur"></div>
<div class="prog" id="prog"></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);

/* ---------- global effects: particles, cursor glow, scroll progress ---------- */
(function(){
  const c=document.getElementById('cv'),x=c.getContext('2d');let W,H,P=[],m={x:-999,y:-999};
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(80,Math.floor(W/16))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.6+.5}))};
  rs();addEventListener('resize',rs);
  const cur=document.getElementById('cur'),pg=document.getElementById('prog');
  addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY;cur.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'});
  addEventListener('scroll',()=>{pg.style.transform='scaleX('+(scrollY/(document.documentElement.scrollHeight-innerHeight||1))+')'},{passive:true});
  (function f(){x.clearRect(0,0,W,H);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<120){p.x+=dx/d*1.4;p.y+=dy/d*1.4}
      x.fillStyle='rgba(182,156,255,.7)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<110){x.strokeStyle='rgba(139,92,246,'+(.25*(1-d/110))+')';x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
    requestAnimationFrame(f)})();
})();

/* ---------- helpers ---------- */
function useInView(){const r=useRef(),[v,s]=useState(false);useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){s(true);o.disconnect()}},{threshold:.15});o.observe(r.current);return()=>o.disconnect()},[]);return[r,v]}
function Reveal({children,className='',delay=0}){const [r,v]=useInView();return html`<div ref=${r} className=${'rv '+className+(v?' in':'')} style=${{transitionDelay:delay+'ms'}}>${children}</div>`}
function Card({children,className='',style}){
  const mv=e=>{const el=e.currentTarget,b=el.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;
    el.style.setProperty('--x',px*b.width+'px');el.style.setProperty('--y',py*b.height+'px');
    el.style.transform='perspective(900px) rotateX('+((.5-py)*8)+'deg) rotateY('+((px-.5)*8)+'deg) translateY(-6px)'};
  const lv=e=>{e.currentTarget.style.transform=''};
  return html`<div className=${'card '+className} style=${style} onMouseMove=${mv} onMouseLeave=${lv}>${children}</div>`}
function Magnetic({href,className,children}){
  const mv=e=>{const b=e.currentTarget.getBoundingClientRect();e.currentTarget.style.transform='translate('+((e.clientX-b.left-b.width/2)*.25)+'px,'+((e.clientY-b.top-b.height/2)*.35)+'px)'};
  return html`<a href=${href} className=${'btn '+className} onMouseMove=${mv} onMouseLeave=${e=>e.currentTarget.style.transform=''}>${children}</a>`}
function Count({to,suffix=''}){
  const [r,v]=useInView(),[n,setN]=useState(0);
  useEffect(()=>{if(!v)return;let s=null;const f=t=>{s=s||t;const p=Math.min((t-s)/1400,1);setN(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)},[v]);
  return html`<span ref=${r}>${n}${suffix}</span>`}
function Head({k,t}){return html`<${Reveal} className="sh"><small>${k}</small><h2>${t}</h2><//>`}
function Chips({items}){return html`<div className="chips">${items.map(i=>html`<span className="chip" key=${i}>${i}</span>`)}</div>`}
function Typer({words}){
  const [t,setT]=useState(''),i=useRef(0),d=useRef(false);
  useEffect(()=>{let to;const f=()=>{const w=words[i.current%words.length];
    setT(p=>d.current?w.slice(0,p.length-1):w.slice(0,p.length+1));
    const cur=d.current?t.length-1:t.length+1;
    if(!d.current&&cur>=w.length){d.current=true;to=setTimeout(f,1400)}
    else if(d.current&&cur<=0){d.current=false;i.current++;to=setTimeout(f,300)}
    else to=setTimeout(f,d.current?35:70)};
    to=setTimeout(f,500);return()=>clearTimeout(to)});
  return html`<span>${t}<i className="caret"></i></span>`}

/* ---------- data ---------- */
const nav=['About','Experience','Projects','Skills','Contact'];
const ticker=['Laravel 12','FastAPI','React','Next.js','PHP','Python','MySQL','CodeIgniter 4','Gemini API','Surya OCR','Tesseract','Qwen 8B','Cloudflare','SendGrid','Docker','WordPress','Shopify','Arduino'];
